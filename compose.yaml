name: voxloom

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${VOXLOOM_PUBLIC_ORIGIN:-http://localhost:8080}
      DATABASE_URL: sqlite+aiosqlite:////data/voiceagent.db
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      KNOWLEDGE_RAG_ENABLED: ${KNOWLEDGE_RAG_ENABLED:-false}
      QDRANT_URL: http://qdrant:6333
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    secrets:
      - jwt_secret
      - openai_api_key
    volumes:
      - app_data:/data
    networks:
      - edge
      - internal
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    ports:
      - "${VOXLOOM_HTTP_PORT:-8080}:80"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: qdrant/qdrant:v1.15.4-unprivileged
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

networks:
  edge:
  internal:
    internal: true

volumes:
  app_data:
  qdrant_data:

secrets:
  jwt_secret:
    environment: VOXLOOM_JWT_SECRET
  openai_api_key:
    file: ${VOXLOOM_OPENAI_API_KEY_FILE:-./deploy/secrets/openai_api_key.empty}
