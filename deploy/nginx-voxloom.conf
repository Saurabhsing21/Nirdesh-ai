server {
    listen 80;
    listen [::]:80;
    server_name voxloom.xyz www.voxloom.xyz 143-244-135-79.sslip.io;

    # WebSocket authentication currently uses a query parameter. Do not let
    # access logs or routine upstream reset errors persist that JWT.
    access_log off;
    error_log /var/log/nginx/voxloom-error.log crit;

    root /opt/voxloom/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(auth|wallet|analytics|health|docs|openapi.json|redoc)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
